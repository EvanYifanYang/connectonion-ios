name: iOS Tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and UI Tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Project targets iOS 26 / Xcode 26 — prefer a 26.x toolchain, else use the runner default.
          XCODE_26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run All Tests
        run: |
          set -o pipefail
          # GitHub's shared macOS runners are slow/contended (a mock stream that takes ~8s locally
          # can take ~27s here), so UI tests occasionally time out. Retry a failed test up to 3x;
          # if it passes on a retry the run is green. Unit tests are hermetic and won't need it.
          xcodebuild test \
            -project "ConnectOnion iOS.xcodeproj" \
            -scheme "ConnectOnion iOS" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3
