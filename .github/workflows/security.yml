name: Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential that was committed and later removed is still
          # recoverable from the object store, so scanning the working tree alone
          # would miss it.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # Pinned to the version the baseline scan was verified against locally.
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl --fail --location --silent --show-error \
            -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${SHA256}  ${ARCHIVE}" | sha256sum --check --status
          tar -xzf "$ARCHIVE" -C /usr/local/bin gitleaks
          rm "$ARCHIVE"
          gitleaks version

      - name: Scan commit history
        run: |
          # Reviewed false positives live in .gitleaksignore, each with a written
          # justification. Anything not listed there fails this job.
          gitleaks git --no-banner --redact --verbose

  dependencies:
    name: Dependency Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report pinned Swift package versions
        run: |
          # Dependabot does not resolve Swift packages declared inside an .xcodeproj
          # (it only reads a root Package.swift), so the pinned set is surfaced here
          # instead. Automated update PRs for GitHub Actions are configured in
          # .github/dependabot.yml.
          RESOLVED="ConnectOnion iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          if [ ! -f "$RESOLVED" ]; then
            echo "::error::Package.resolved not found at $RESOLVED"
            exit 1
          fi

          PIN_COUNT=$(jq -er '
            if ((.pins | type) == "array" and (.pins | length) > 0) then
              .pins | length
            else
              error("Package.resolved must contain at least one pin")
            end
          ' "$RESOLVED")

          echo "### Pinned Swift package dependencies (${PIN_COUNT})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Version | Source |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          jq -er '
            .pins
            | sort_by(.identity)[]
            | "| \(.identity) | \(.state.version // .state.branch // .state.revision[0:12]) | \(.location) |"
          ' "$RESOLVED" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Every dependency is pinned to an exact revision." >> "$GITHUB_STEP_SUMMARY"
