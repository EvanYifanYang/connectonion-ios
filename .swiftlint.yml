# SwiftLint configuration — ConnectOnion iOS
#
# Adoption strategy: baseline freeze, then ratchet.
#
# SwiftLint was introduced after the codebase already existed, so a stock ruleset
# would have failed on 235 pre-existing findings. Instead of disabling rules or
# suppressing the report, every threshold below is pinned just above the current
# measured peak. The result: today's tree is clean, and any *new* code that pushes
# past the existing high-water mark fails CI.
#
# Each relaxation records the measured peak so the ceiling can be lowered as the
# corresponding debt is paid down. Numbers were measured with SwiftLint 0.65.0.

included:
  - ConnectOnion iOS
  - ConnectOnionShared
  - ConnectOnionWidget
  - ConnectOnion iOSTests
  - ConnectOnion iOSUITests

excluded:
  - .build
  - DerivedData
  - ${PWD}/.build

# ─── Line length ────────────────────────────────────────────────────────────────
# Measured peak: 204 characters (AgentDirectoryService.swift).
# Target remains 120; 140 keeps the warning signal useful while the long lines are
# reflowed module by module. The 210 ceiling is a hard stop against regression.
line_length:
  warning: 140
  error: 210
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: false
  ignores_interpolated_strings: true

# ─── File and type size ─────────────────────────────────────────────────────────
# Measured peaks: file 1013 lines, type body 851 lines (both ChatViewModel.swift).
# ChatViewModel is the known decomposition candidate — see docs/internal-docs/
# 04-chat-and-conversations.md. Ceilings sit just above it so nothing else grows
# to that size.
file_length:
  warning: 800
  error: 1100

type_body_length:
  warning: 400
  error: 900

# ─── Function size and complexity ───────────────────────────────────────────────
# Measured peaks: 161-line function body, cyclomatic complexity 24
# (ChatEventReducer.swift and ChatViewModel.swift — both are event-dispatch
# switches over the protocol event set, where a wide switch is the clearer form).
function_body_length:
  warning: 100
  error: 200

cyclomatic_complexity:
  warning: 15
  error: 30
  ignores_case_statements: true

# ─── Naming ─────────────────────────────────────────────────────────────────────
# Xcode derives these type names from the "ConnectOnion iOS" target name; the
# underscore is generated, not chosen, and renaming would break the project file.
type_name:
  allowed_symbols: ["_"]
  min_length: 3
  max_length: 50

# Short names are confined to tight local scopes: parser cursors in
# MarkdownParser.swift and geometry/animation locals in OnionThinkingMark.swift
# and AppShellView.swift. Listing them explicitly keeps the rule active for
# everything else rather than lowering the global minimum.
identifier_name:
  min_length: 3
  max_length: 50
  excluded:
    - a
    - ch
    - el
    - i
    - id
    - p
    - q
    - s
    - t
    - x
    - y

nesting:
  type_level: 2

large_tuple:
  warning: 3
  error: 4

# ─── Opt-in rules ───────────────────────────────────────────────────────────────
# Enabled deliberately: these catch real defects rather than style drift, and the
# tree already passes them.
opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

reporter: "xcode"
